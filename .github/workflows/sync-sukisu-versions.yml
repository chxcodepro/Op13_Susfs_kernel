name: Sync SukiSU versions

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-sukisu-versions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check workflow update credential
        env:
          SYNC_TOKEN: ${{ secrets.SUKISU_VERSION_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo '::error::Set SUKISU_VERSION_SYNC_TOKEN to a repository-scoped token with Contents and Workflows write access.'
            exit 1
          fi

      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.SUKISU_VERSION_SYNC_TOKEN }}

      - name: Test version synchronization
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_sync_sukisu_versions.py' -v

      - name: Read latest official release and update choices
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/sync_sukisu_versions.py

      - name: Publish changed dropdown
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          workflow='.github/workflows/Build SukiSU_Ultra.yml'
          if git diff --quiet -- "$workflow"; then
            echo "- Dropdown already current: $VERSION" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$workflow"
          git commit -m "ci: sync SukiSU version choices to $VERSION"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "- Published latest stable choice: $VERSION" >> "$GITHUB_STEP_SUMMARY"
