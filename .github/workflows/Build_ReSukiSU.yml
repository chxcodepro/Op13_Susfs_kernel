name: OP13 BakaSU (ReSukiSU)

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  SUB_VERSION: "118"
  DEVICE_NAME: OP13
  DEVICE_CODENAME: sun
  CCTV18_BUILD_REPO: cctv18/oppo_oplus_realme_sm8750
  CCTV18_COMMON_REPO: cctv18/android_kernel_common_oneplus_sm8750
  CCTV18_KERNEL_REF: oneplus/sm8750_b_16.0.0_oneplus_13_6.6.118
  CCTV18_TOOLCHAIN_RELEASE: LLVM-Clang18-r510928
  CCACHE_DIR: ${{ github.workspace }}/.ccache_op13_resukisu_cctv18
  # v111 pins (reproducible build). Change deliberately, in pairs where noted.
  CCTV18_ASSETS_REF: "21db9e7d547ca625bd5aa734fb5dfc8b94ea48ef"
  CCTV18_KERNEL_COMMIT: "2a4726b11594dd57d0779d2685fad5c81e5ed553"
  # v111: who implements SELinux hiding. bakasu (default) = BakaSU's own
  # selinux_hide with the KernelSU #3877 timing side-channel fix; SUSFS's
  # SELinux-hide sections are not applied. susfs = apply them and let BakaSU
  # use SUSFS's hooks (no #3877 fix -- this is why BakaSU blocks SUSFS builds).
  OX_BAKASU_SELINUX_HIDE_OWNER: bakasu
  # Flasher (AnyKernel3) branding -- matches the release template.
  OX_ROOT_DISPLAY_NAME: "BakaSU"
  OX_ROOT_CREDIT: "@Baka-SU"
  RESUKISU_SETUP_REF: "d7260ca1e5c128061122924d0d48754e361e135c"
  AK3_REF: "020dfeccf9d7e962a48400fc94d3e451df92eead"
  CCACHE_MAXSIZE: 8G

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "构建预设。日常稳定使用推荐 stock_daily。"
        required: true
        type: choice
        options: [stock_daily, stock_plus, minimal_safe, debug_only]
        default: stock_daily
      resukisu_ref:
        description: "BakaSU 源码分支或提交（Baka-SU/BakaSU；ReSukiSU 已更名，管理器包名 com.resukisu.resukisu 和签名密钥不变）。必须与 susfs_ref 配套：no_su 版本要求驱动提供 susfs_set_current_proc_no_su，SUSFS 包含 525c450 或后续提交。v111 默认 d7260ca 为 2026-10-14 的 BakaSU main。48fa4bb 通过 kernel/tools/susfs_compat.mk 阻止 SUSFS 构建，原因是其 SELinux 隐藏钩子缺少 KernelSU #3877 时序侧信道修复。本流程不应用这部分 SUSFS 补丁，改用 BakaSU 自身的 selinux_hide 后才解除限制；已验证相关对象和完整驱动编译及跨模块符号解析。此前已知可用配对：23a40c0 + SUSFS 383616f（v108）。"
        required: true
        type: string
        default: "d7260ca1e5c128061122924d0d48754e361e135c"
      kpm_enable:
        description: "KPM（KernelPatch Module）支持，ReSukiSU 默认关闭。已核对的固定提交没有内核端 KPM 实现，仅保留弃用的管理器/UAPI 枚举；勾选也不会生成 CONFIG_KPM=y，只会提示已请求但不存在 KPM。KPM 是 SukiSU Ultra 的功能，此流程请保持关闭。"
        required: true
        type: boolean
        default: false
      multi_manager_support:
        description: "所选 ReSukiSU 源码支持时，启用多管理器支持。"
        required: true
        type: boolean
        default: true
      SUSFS:
        description: "仅启用 CCTV18 susfs4oki，不混用 WildKernels/TheWildJames 的 SUSFS 源码。"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"
      susfs_ref:
        description: "CCTV18 susfs4oki 提交（oki-android15-6.6）。v111 默认 3f6aae5 为 2026-10-15 的 SUSFS v2.3.0，已同步 KernelSU 0a1f3ff，包含 525c450 的 no_su 保护。保留 sus_path、sus_mount、sus_kstat、sus_map、uname/cmdline 伪装、open_redirect、kallsyms 隐藏和 AVC 日志伪装；仅将 security/selinux/hooks.c、selinuxfs.c、ss/services.c 的 SELinux 隐藏交给 BakaSU，见 OX_BAKASU_SELINUX_HIDE_OWNER。此前固定版本为 383616f，搭配 ReSukiSU 23a40c0（v108）。必须与驱动同代，否则会跳过所有应用和 shell 的 su 重定向。"
        required: true
        type: string
        default: "3f6aae536724af0df3dfa15f932034d14a5dbc5c"
      susfs_patch_policy:
        description: "补丁失败策略：strict 遇到拒绝即失败；audited_cctv18 仅容许已知的 task_mmu 拒绝；native_cctv18 按 CCTV18 方式记录并继续。"
        required: true
        type: choice
        options: [audited_cctv18, strict, native_cctv18]
        default: audited_cctv18
      hook_mode:
        description: "钩子来源。inline_susfs 使用 SUSFS 内联钩子，是当前固定源码配对支持的模式。"
        required: true
        type: choice
        options: [inline_susfs, resukisu_auto, tracepoint_test]
        default: inline_susfs
      kernel_suffix:
        description: "内核版本后缀（LOCALVERSION），不要填写开头的横线。默认与 PJZ110_17.0.0.103 截图一致；对齐版本标识不等于完成固件适配。"
        required: false
        type: string
        default: "android15-8-g9bc34d5b0c79-abogki537459655-4k"
      kernel_name:
        description: "内核管理器和刷机横幅中的显示名称，不改变 uname -r。可自行修改，例如 OX13-ReSukiSU。"
        required: false
        type: string
        default: "PJZ110 | BakaSU [Inline StockLike] + CCTV18 SUSFS (OP-OX)"
      optimise:
        description: "优化级别：日常稳定使用默认 O2；O3 仅用于测试。"
        required: true
        type: choice
        options: [O2, O3]
        default: O2
      lz4_zram_patch:
        description: "CCTV18 LZ4/ZSTD/ZRAM 补丁组，默认 Off。补丁会修改 include/linux/lz4.h 等内核头文件，存在 GKI 2.0 KMI 风险，且不能干净应用到当前源码。原配置已包含 ZRAM、lz4 和 zstd，保持 Off 不改变这些运行时功能，并避免每次构建的 3 条跳过警告。仅在确认补丁与所选源码匹配后开启。"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "Off"
      zram_module:
        description: "启用额外 LZ4/LZ4HC/ZSTD 配置。ZRAM/ZSMALLOC 保持模块化，兼容 ColorOS 原厂 HybridSwap；运行参数由系统或调优模块管理。"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"
      bbg:
        description: "安装固定提交 a5b57f1 的 Baseband Guard LSM，启用基带分区写入保护。"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"
      bbr:
        description: "将 TCP BBR 编译入内核，运行时可选，不强制设为系统默认。日常使用建议 On。"
        required: true
        type: choice
        options: ["Off", "On", "Default"]
        default: "On"
      adios:
        description: "启用源码内置的 ADIOS I/O 调度器，并设为默认调度器。"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "Off"
      rekernel:
        description: "启用源码内置的 Re:Kernel，供后台冻结应用使用。"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"
      proxy:
        description: "启用增强网络、TTL 和 IP_SET 相关配置。"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"
      fengchi:
        description: "存在时应用实验性的风驰/HMBIRD 调度器补丁；为稳定性和续航考虑，默认 Off。"
        required: true
        type: choice
        options: ["Off", "On"]
        default: "Off"
      zram_comp:
        description: "内核支持时优先使用的 ZRAM 压缩算法。"
        required: true
        type: choice
        options: [lz4, lzo-rle, zstd]
        default: lz4
      clean_ccache:
        description: "构建前删除 ccache 缓存，仅在排查缓存问题时启用。"
        required: true
        type: boolean
        default: false
      BUILD_TIME:
        description: "自定义编译时间；填写 F 使用当前 UTC 时间。"
        required: false
        type: string
        default: "F"
      BUILD_USER:
        description: "编译者名称（KBUILD_BUILD_USER）。"
        required: false
        type: string
        default: "kleaf"
      BUILD_HOST:
        description: "编译主机名称（KBUILD_BUILD_HOST）。"
        required: false
        type: string
        default: "build-host"
concurrency:
  group: op13-resukisu-cctv18-inline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: "${{ inputs.profile }} | BakaSU=${{ inputs.resukisu_ref }} | Hook=${{ inputs.hook_mode }} | SUSFS=${{ inputs.SUSFS }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: "Runner disk preflight"
        id: disk
        shell: bash
        run: |
          set -euo pipefail
          echo "Memory and swap:"
          free -h || true
          echo ""
          echo "Disk usage:"
          df -hT || true
          root_free_mb="$(df -Pm / | awk 'NR==2 {print $4}' || echo 0)"
          echo "root_free_mb=$root_free_mb" >> "$GITHUB_OUTPUT"
          if [ "$root_free_mb" -lt 25000 ]; then
            echo "use_cleanup=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_cleanup=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Extra disk cleanup"
        if: steps.disk.outputs.use_cleanup == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f || true
          sudo docker system prune -af || true
          sudo apt-get clean || true
          df -hT || true

      - name: "Checkout"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: "Git auth for non-interactive clones"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global credential.helper store
          git config --global core.askPass true
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: "Setup ccache directory"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"

      - name: "Restore ccache"
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-op13-resukisu-cctv18-${{ inputs.SUSFS }}-${{ inputs.resukisu_ref }}-${{ inputs.hook_mode }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-op13-resukisu-cctv18-${{ inputs.SUSFS }}-${{ inputs.resukisu_ref }}-
            ccache-${{ runner.os }}-op13-resukisu-cctv18-


      - name: "Install build dependencies"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aria2 ca-certificates curl wget git unzip zip tar xz-utils zstd rsync file jq \
            build-essential gcc g++ make bc bison flex gawk python3 python-is-python3 \
            libssl-dev libelf-dev libncurses-dev zlib1g-dev liblz4-tool dwarves \
            ccache clang lld llvm patch kmod
          sudo apt-get clean
          echo "Runner: $(uname -a)"
          ccache --version || true

      - name: "Sync kernel sources"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kernel_workspace cctv18_assets _ox_debug artifacts ak3_work zram_tuner_work
          mkdir -p kernel_workspace _ox_debug artifacts

          echo "==> Cloning CCTV18 build assets only"
          # v111: pin the CCTV18 assets repo. It supplies the CVE patch, config.patch
          # and the optional feature patches, so an unpinned HEAD can change the build.
          git clone "https://github.com/${CCTV18_BUILD_REPO}.git" cctv18_assets
          git -C cctv18_assets checkout -q "${CCTV18_ASSETS_REF}" || {
            echo "::error::Could not checkout pinned CCTV18 assets ref ${CCTV18_ASSETS_REF}."; exit 1; }
          git -C cctv18_assets rev-parse HEAD | tee _ox_debug/cctv18_assets_commit.txt

          cd kernel_workspace
          echo "==> Downloading CCTV18 OP13 common kernel source at pinned commit ${CCTV18_KERNEL_COMMIT}"
          # v111: pin the source to a COMMIT zip, not the moving branch head, so a
          # known-good build is reproducible. Falls back to the branch head only if
          # the commit archive is unavailable.
          aria2c -s16 -x16 -k1M --retry-wait=5 --max-tries=5 \
            "https://github.com/${CCTV18_COMMON_REPO}/archive/${CCTV18_KERNEL_COMMIT}.zip" \
            -o common.zip || \
          aria2c -s16 -x16 -k1M --retry-wait=5 --max-tries=5 \
            "https://github.com/${CCTV18_COMMON_REPO}/archive/refs/heads/${{ env.CCTV18_KERNEL_REF }}.zip" \
            -o common.zip
          unzip -q common.zip
          src_dir="$(find . -maxdepth 1 -type d -name 'android_kernel_common_oneplus_sm8750-*' -print -quit)"
          if [ -z "$src_dir" ]; then
            echo "::error::Could not locate extracted OP13 common kernel directory."
            find . -maxdepth 2 -type d | sort
            exit 1
          fi
          mv "$src_dir" common
          rm -f common.zip

          echo "==> Downloading CCTV18 LLVM/Clang18 and build-tools"
          aria2c -s16 -x16 -k1M --retry-wait=5 --max-tries=5 \
            "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/${CCTV18_TOOLCHAIN_RELEASE}/clang-r510928.zip" \
            -o clang.zip
          unzip -q clang.zip -d clang18
          rm -f clang.zip

          aria2c -s16 -x16 -k1M --retry-wait=5 --max-tries=5 \
            "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/${CCTV18_TOOLCHAIN_RELEASE}/build-tools.zip" \
            -o build-tools.zip
          unzip -q build-tools.zip
          rm -f build-tools.zip

          echo "==> Removing ABI export guard files and dirty suffix noise"
          rm -f common/android/abi_gki_protected_exports_* || true
          if [ -f common/scripts/setlocalversion ]; then
            sed -i 's/ -dirty//g' common/scripts/setlocalversion
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' common/scripts/setlocalversion || true
            # Stock-mimic: kill the trailing "+" that scripts/setlocalversion
            # appends (scm_version --short) for any git tree not on an annotated
            # tag. Without this the real uname -r is
            # "...-4k+", which no stock ColorOS kernel has -- a detection signal
            # and a mismatch with the ROM. Same neutralization CCTV18's own
            # builder uses. CONFIG_LOCALVERSION still supplies the -<suffix>.
            sed -i 's/${scm_version}//' common/scripts/setlocalversion
          fi

          echo "==> Source layout" | tee ../_ox_debug/source-layout.txt
          find . -maxdepth 2 -type d | sort | tee -a ../_ox_debug/source-layout.txt


      - name: "Select toolchain"
        shell: bash
        run: |
          set -euo pipefail
          echo "$GITHUB_WORKSPACE/kernel_workspace/clang18/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/kernel_workspace/build-tools/path/linux-x86" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang18/bin:$GITHUB_WORKSPACE/kernel_workspace/build-tools/path/linux-x86:$PATH"
          echo "Toolchain check:"
          command -v clang || true
          clang --version || true
          command -v ld.lld || true
          ld.lld --version || true

      - name: "Configure ccache limits"
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.clean_ccache }}" = "true" ]; then
            rm -rf "$CCACHE_DIR"
          fi
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          ccache -z || true
          ccache -s || true

      - name: "Integrate BakaSU (formerly ReSukiSU; official setup.sh)"
        id: resukisu
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang18/bin:$GITHUB_WORKSPACE/kernel_workspace/build-tools/path/linux-x86:$PATH"

          echo "==> Installing ReSukiSU"
          requested_ref="${{ inputs.resukisu_ref }}"
          selected_ref="$requested_ref"
          echo "Requested ReSukiSU ref: $requested_ref"

          if [ "$requested_ref" = "auto" ]; then
            echo "==> Resolving best available ReSukiSU ref"
            selected_ref=""
            for cand in main stable; do
              if git ls-remote --exit-code --heads https://github.com/Baka-SU/BakaSU.git "$cand" >/dev/null 2>&1 || git ls-remote --exit-code --tags https://github.com/Baka-SU/BakaSU.git "$cand" >/dev/null 2>&1; then
                selected_ref="$cand"
                break
              fi
            done
            if [ -z "$selected_ref" ]; then
              echo "::error::Could not resolve a usable ReSukiSU ref. Use main or a real tag/commit."
              exit 1
            fi
          fi

          echo "Selected ReSukiSU ref: $selected_ref" | tee ../_ox_debug/resukisu-selected-ref.txt
          echo "RESUKISU_SELECTED_REF=$selected_ref" >> "$GITHUB_ENV"
          echo "selected_ref=$selected_ref" >> "$GITHUB_OUTPUT"

          # Clean ReSukiSU lane: use ReSukiSU's own setup script only.
          # No SukiSU Ultra / KernelSU-Next / WildKernels glue is imported here.
          # v111: fetch setup.sh from the PINNED ReSukiSU commit, not main, so the
          # installer script matches the driver commit we check out.
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/${RESUKISU_SETUP_REF}/kernel/setup.sh" | bash -s "$selected_ref"

          if [ -d KernelSU ]; then
            KSU_TREE="KernelSU"
          elif [ -d common/drivers/kernelsu ]; then
            KSU_TREE="common/drivers/kernelsu"
          else
            echo "::error::ReSukiSU tree was not found after setup."
            find . -maxdepth 4 -type d | sort | sed -n '1,240p'
            exit 1
          fi
          echo "KSU_TREE=$KSU_TREE" | tee -a "$GITHUB_ENV"
          echo "resukisu_tree=$KSU_TREE" >> "$GITHUB_OUTPUT"

          if [ -d KernelSU/.git ]; then
            git -C KernelSU rev-parse HEAD | tee ../_ox_debug/resukisu_commit.txt || true
            git -C KernelSU status --short --branch | tee ../_ox_debug/resukisu_status.txt || true
            actual_branch="$(git -C KernelSU branch --show-current 2>/dev/null || true)"
            requested="$selected_ref"
            requested_sha="$(git -C KernelSU rev-parse --verify "$requested^{commit}" 2>/dev/null || true)"
            actual_sha="$(git -C KernelSU rev-parse HEAD 2>/dev/null || true)"
            {
              echo "requested=$requested"
              echo "actual_branch=$actual_branch"
              echo "requested_sha=$requested_sha"
              echo "actual_sha=$actual_sha"
            } | tee ../_ox_debug/resukisu-ref-audit.txt
            if [ "${{ inputs.resukisu_ref }}" != "auto" ]; then
              if [ -n "$requested_sha" ] && [ "$requested_sha" != "$actual_sha" ]; then
                echo "::error::ReSukiSU setup did not checkout the requested ref."
                exit 1
              fi
              if [ -z "$requested_sha" ] && [ "$actual_branch" != "$requested" ]; then
                echo "::error::Requested ReSukiSU ref '$requested' was not checked out. Use main, auto, a valid tag, or commit."
                exit 1
              fi
            fi
          fi

          if [ ! -e common/drivers/kernelsu ]; then
            echo "::error::common/drivers/kernelsu link/path missing after ReSukiSU setup."
            exit 1
          fi
          if [ ! -f common/drivers/Makefile ] || ! grep -q 'CONFIG_KSU' common/drivers/Makefile; then
            echo "::error::drivers/Makefile does not include ReSukiSU kernelsu object."
            exit 1
          fi
          if [ ! -f common/drivers/Kconfig ] || ! grep -q 'drivers/kernelsu/Kconfig' common/drivers/Kconfig; then
            echo "::error::drivers/Kconfig does not include ReSukiSU kernelsu Kconfig."
            exit 1
          fi

          # Version information is best-effort only. Do not break clean builds if upstream changes Kbuild variables.
          if [ -d KernelSU/.git ]; then
            cnt="$(git -C KernelSU rev-list --count HEAD 2>/dev/null || true)"
            tag="$(git -C KernelSU describe --tags --abbrev=0 2>/dev/null || true)"
            [ -n "$cnt" ] && echo "KSUVER=$((cnt + 30000))" >> "$GITHUB_ENV" || true
            [ -n "$tag" ] && echo "KSUTAG=$tag" >> "$GITHUB_ENV" || true
            echo "resukisu_version_count=$cnt" >> "$GITHUB_OUTPUT"
            echo "resukisu_tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: "Apply SUSFS"
        if: ${{ inputs.SUSFS == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace
          rm -rf susfs4ksu

          echo "==> Cloning CCTV18 SUSFS only: cctv18/susfs4oki @ ${{ inputs.susfs_ref }}"
          # v111: susfs_ref may be a BRANCH/TAG or a COMMIT SHA.
          # `git clone --branch` only accepts branch/tag names, so a pinned SHA has
          # to be fetched explicitly (verified working: GitHub allows shallow
          # fetch-by-SHA on this repo).
          SUSFS_REF_IN="${{ inputs.susfs_ref }}"
          if printf '%s' "$SUSFS_REF_IN" | grep -qE '^[0-9a-fA-F]{7,40}$'; then
            echo "==> Fetching CCTV18 SUSFS at pinned commit $SUSFS_REF_IN"
            rm -rf susfs4ksu && mkdir -p susfs4ksu
            git -C susfs4ksu init -q
            git -C susfs4ksu remote add origin https://github.com/cctv18/susfs4oki.git
            if git -C susfs4ksu fetch -q --depth=1 origin "$SUSFS_REF_IN"; then
              git -C susfs4ksu checkout -q FETCH_HEAD
            else
              echo "==> Shallow fetch-by-SHA unavailable; falling back to full clone."
              rm -rf susfs4ksu
              git clone -q https://github.com/cctv18/susfs4oki.git susfs4ksu
              git -C susfs4ksu checkout -q "$SUSFS_REF_IN"
            fi
            got="$(git -C susfs4ksu rev-parse HEAD)"
            case "$got" in
              "$SUSFS_REF_IN"*) echo "==> SUSFS checked out at $got" ;;
              *) echo "::error::Requested SUSFS ref $SUSFS_REF_IN but got $got."; exit 1 ;;
            esac
          else
            git clone --depth=1 --branch "$SUSFS_REF_IN" https://github.com/cctv18/susfs4oki.git susfs4ksu
          fi
          git -C susfs4ksu rev-parse HEAD | tee ../_ox_debug/cctv18_susfs_commit.txt
          git -C susfs4ksu remote -v | tee ../_ox_debug/cctv18_susfs_remote.txt

          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch"
          if [ ! -f "$SUSFS_PATCH" ]; then
            echo "::error::CCTV18 SUSFS common patch not found: $SUSFS_PATCH"
            find susfs4ksu/kernel_patches -maxdepth 3 -type f | sort
            exit 1
          fi

          cp -af susfs4ksu/kernel_patches/fs/. common/fs/
          cp -af susfs4ksu/kernel_patches/include/linux/. common/include/linux/
          cp -f "$SUSFS_PATCH" common/

          echo "==> Skipping 69_hide_stuff.patch for the first ReSukiSU stable lane"
          echo "Reason: keep this build focused on ReSukiSU inline SUSFS first; avoid SELinux policy-query link issues seen on SukiSU builtin."

          cd common
          # ---- v111: upstream security fix CVE-2026-43499 (rtmutex) ----
          # Fixes a NULL-pointer dereference in remove_waiter(): when called via
          # rt_mutex_start_proxy_lock(), waiter->task may be NULL (never enqueued),
          # and the old code dereferenced it unconditionally.
          # Adopted from cctv18/oppo_oplus_realme_sm8750 (other_patch/), which is the
          # same asset repo this workflow already clones. CCTV18's own 6.6.118 builder
          # applies it WITHOUT "|| true", i.e. they treat it as mandatory.
          # SAFETY: this patch touches ONLY kernel/locking/rtmutex.c and rtmutex_api.c
          # -- no headers, so no struct/prototype change and therefore no GKI 2.0 KMI
          # impact. Verified absent from the 6.6.118 source, so it is genuinely needed.
          # Applied all-or-nothing: if it would not apply fully we skip and warn loudly
          # rather than half-patch core locking code.
          CVE_PATCH="$GITHUB_WORKSPACE/cctv18_assets/other_patch/cve-2026-43499-rtmutex-6.6.patch"
          if [ -f "$CVE_PATCH" ]; then
            if patch --dry-run -p1 -N -F 3 < "$CVE_PATCH" \
                 > "$GITHUB_WORKSPACE/_ox_debug/dryrun-cve-2026-43499.log" 2>&1; then
              patch -p1 -N -F 3 < "$CVE_PATCH" \
                > "$GITHUB_WORKSPACE/_ox_debug/apply-cve-2026-43499.log" 2>&1
              if grep -q "waiter_task" kernel/locking/rtmutex.c; then
                echo "==> CVE-2026-43499 rtmutex security patch APPLIED and verified."
                echo "CVE-2026-43499: applied" > "$GITHUB_WORKSPACE/_ox_debug/cve-status.txt"
              else
                echo "::warning::CVE-2026-43499 patch reported success but the fix marker is missing. Treating as NOT applied."
                echo "CVE-2026-43499: NOT applied (verification failed)" > "$GITHUB_WORKSPACE/_ox_debug/cve-status.txt"
              fi
            else
              echo "::warning::CVE-2026-43499 rtmutex patch would not apply cleanly (kernel may already contain the fix, or context changed). Skipped -- kernel is NOT patched for this CVE."
              echo "CVE-2026-43499: SKIPPED (dry-run failed)" > "$GITHUB_WORKSPACE/_ox_debug/cve-status.txt"
              cat "$GITHUB_WORKSPACE/_ox_debug/dryrun-cve-2026-43499.log" || true
            fi
          else
            echo "::warning::CVE-2026-43499 patch not found in cctv18_assets/other_patch; skipping."
            echo "CVE-2026-43499: patch file not found" > "$GITHUB_WORKSPACE/_ox_debug/cve-status.txt"
          fi

          # ---- v111: upstream 6.6-stable security fix (posix-cpu-timers UAF) ----
          # Backport of the 6.6-stable commit
          #   12a891c773aeb5823d63dbd0cb2ab931d6c21c9b
          #   "posix-cpu-timers: Prevent UAF caused by non-leader exec() race"
          # (mainline 920f893f735e). It fixes a use-after-free reachable from
          # ordinary userspace (timer_delete racing a non-leader exec()), which on
          # affected 6.6 builds is a local-root primitive. CCTV18's 6.6.118 source
          # predates it. Applied the same best-effort way as CVE-2026-43499: fetched
          # from the pinned upstream-stable commit, verified absent, dry-run checked,
          # applied all-or-nothing; the build continues if the kernel already has it
          # or if the context no longer matches. Touches only kernel/{exit,signal}.c
          # and kernel/time/posix-cpu-timers.c -- no headers, so no GKI 2.0 KMI
          # impact. Set OX_SKIP_UAF_FIX=1 in the workflow env to skip it.
          if [ "${OX_SKIP_UAF_FIX:-0}" = "1" ]; then
            echo "posix-cpu-timers UAF fix: skipped (OX_SKIP_UAF_FIX=1)" | tee "$GITHUB_WORKSPACE/_ox_debug/sec-posix-timers.txt"
          else
            UAF_SHA="12a891c773aeb5823d63dbd0cb2ab931d6c21c9b"
            UAF_DIR="$GITHUB_WORKSPACE/_ox_sec_posix_timers"
            rm -rf "$UAF_DIR"; mkdir -p "$UAF_DIR"
            (
              cd "$UAF_DIR"
              git init -q
              git remote add origin https://github.com/gregkh/linux
              # depth=2 so the commit's parent is present and `git show` yields the
              # real per-commit diff rather than whole-file additions.
              git fetch -q --depth=2 origin "$UAF_SHA"
              git show FETCH_HEAD -- kernel/time/posix-cpu-timers.c kernel/exit.c kernel/signal.c > uaf.patch
            ) > "$GITHUB_WORKSPACE/_ox_debug/sec-posix-timers-fetch.log" 2>&1 || true
            UAF_PATCH="$UAF_DIR/uaf.patch"
            if [ ! -s "$UAF_PATCH" ]; then
              echo "::warning::Could not fetch the posix-cpu-timers UAF fix; kernel is NOT patched for it."
              echo "posix-cpu-timers UAF fix: fetch failed (NOT applied)" | tee "$GITHUB_WORKSPACE/_ox_debug/sec-posix-timers.txt"
            elif patch -p1 --dry-run -R -F3 < "$UAF_PATCH" >/dev/null 2>&1; then
              echo "posix-cpu-timers UAF fix: already present in source (skipped)" | tee "$GITHUB_WORKSPACE/_ox_debug/sec-posix-timers.txt"
            elif patch -p1 --dry-run -N -F3 < "$UAF_PATCH" > "$GITHUB_WORKSPACE/_ox_debug/dryrun-posix-timers.log" 2>&1; then
              patch -p1 -N -F3 < "$UAF_PATCH" > "$GITHUB_WORKSPACE/_ox_debug/apply-posix-timers.log" 2>&1
              if grep -q "timer_lock_sighand" kernel/time/posix-cpu-timers.c; then
                echo "posix-cpu-timers UAF fix: applied ($UAF_SHA)" | tee "$GITHUB_WORKSPACE/_ox_debug/sec-posix-timers.txt"
              else
                echo "::warning::posix-cpu-timers UAF fix reported success but the marker is missing; treating as NOT applied."
                echo "posix-cpu-timers UAF fix: NOT applied (verification failed)" | tee "$GITHUB_WORKSPACE/_ox_debug/sec-posix-timers.txt"
              fi
            else
              echo "::warning::posix-cpu-timers UAF fix did not dry-run cleanly (context changed or already fixed). Skipped -- not partially patched."
              echo "posix-cpu-timers UAF fix: SKIPPED (dry-run failed)" | tee "$GITHUB_WORKSPACE/_ox_debug/sec-posix-timers.txt"
              cat "$GITHUB_WORKSPACE/_ox_debug/dryrun-posix-timers.log" || true
            fi
          fi

          # ---- v111: driver/SUSFS pairing check ----
          # The su hook is guarded in fs/exec.c. CCTV18 SUSFS 525c450 renamed that
          # guard from susfs_is_current_proc_umounted() to
          # susfs_is_current_proc_no_su(). ReSukiSU 03b60f2 switched the driver to
          # set the matching no_su mark. Mixing generations makes the new guard
          # read the old umounted mark as "no su", so `su` is skipped for every app
          # and shell while apps using binder/supercall still get root.
          # v108 PAIRING GUARD FIX. The v107 guard ran from kernel_workspace/common
          # but used paths relative to kernel_workspace (susfs4ksu/..., KernelSU/...),
          # so with grep -s the checks silently found nothing and the guard ALWAYS
          # wrote "pairing: OK (susfs=0 driver=0)" -- it could never fail, even on a
          # genuine mismatch. We now use absolute paths under kernel_workspace and
          # HARD-FAIL if either file is missing, so a real generation mismatch (which
          # breaks `su` from shells) can no longer slip through.
          KW="$GITHUB_WORKSPACE/kernel_workspace"
          SUSFS_DEF="$KW/susfs4ksu/kernel_patches/include/linux/susfs_def.h"
          if [ ! -f "$SUSFS_DEF" ]; then
            echo "::error::pairing guard: SUSFS def header not found at $SUSFS_DEF."
            echo "pairing: ERROR (susfs_def.h missing)" > "$GITHUB_WORKSPACE/_ox_debug/pairing.txt"; exit 1
          fi
          if [ ! -d "$KW/KernelSU/kernel" ]; then
            echo "::error::pairing guard: ReSukiSU driver tree not found at $KW/KernelSU/kernel."
            echo "pairing: ERROR (driver tree missing)" > "$GITHUB_WORKSPACE/_ox_debug/pairing.txt"; exit 1
          fi
          SUSFS_NEW=0; DRV_NEW=0
          grep -q "susfs_is_current_proc_no_su" "$SUSFS_DEF" && SUSFS_NEW=1
          # v111: match the DRIVER's own no_su setter, not the ambiguous
          # ksu_is_current_proc_unprivillege alias (which exists as a `#define ... false`
          # stub in the non-SUSFS branch too and would false-positive an old driver).
          grep -rq "susfs_set_current_proc_no_su" "$KW/KernelSU/kernel/" 2>/dev/null && DRV_NEW=1
          echo "==> pairing: SUSFS_new=$SUSFS_NEW driver_new=$DRV_NEW"
          if [ "$SUSFS_NEW" != "$DRV_NEW" ]; then
            echo "::error::MISMATCHED PAIR: SUSFS_new=$SUSFS_NEW but driver_new=$DRV_NEW. This combination breaks \`su\` from shells. Use ReSukiSU main with a susfs_ref at/after 525c450, or pin BOTH to the older generation."
            echo "pairing: MISMATCH (susfs=$SUSFS_NEW driver=$DRV_NEW)" > "$GITHUB_WORKSPACE/_ox_debug/pairing.txt"
            exit 1
          fi
          echo "pairing: OK (susfs=$SUSFS_NEW driver=$DRV_NEW)" > "$GITHUB_WORKSPACE/_ox_debug/pairing.txt"

          # ---- v111: BakaSU + CCTV18 SUSFS integration ----
          # BakaSU main (48fa4bb, 2026-10-10) ends kernel/tools/susfs_compat.mk with
          #     $(error Please wait susfs update.)
          # Reason given upstream: SUSFS's SELinux-hide hooks have not picked up
          # KernelSU #3877 (timing side-channel fix in selinux hide), and users
          # running them got detected. CCTV18 SUSFS 3f6aae5 still replaces that
          # logic with its own my_security_* path (no live-sidtab sync), so simply
          # deleting the gate would bring the detection back.
          #
          # What v111 does instead (OX_BAKASU_SELINUX_HIDE_OWNER=bakasu, default):
          #  1. SUSFS's SELinux-hide sections (security/selinux/hooks.c,
          #     selinuxfs.c, ss/services.c) are NOT applied. Every other SUSFS
          #     feature is applied unchanged (fs/*, avc.c log spoof, kallsyms,
          #     uname, cmdline, input, reboot, sys, mm).
          #  2. BakaSU's susfs_compat.mk then finds no manual SELinux-hide hook
          #     and builds its OWN selinux_hide (runtime write_op patching, with
          #     the #3877 fix) -- the path BakaSU ships for non-SUSFS kernels.
          #  3. Only then is the gate removed. Its exact 3 lines are checked
          #     first; if BakaSU changes the file, the build stops instead of
          #     guessing. The file is marked assume-unchanged so the driver's
          #     version string does not get a "-dirty" suffix.
          # Sandbox-verified: SUSFS objects + full BakaSU driver compile, all
          # cross-symbols resolve, BakaSU logs no "selinux_hide manual hook".
          SEL_OWNER="${OX_BAKASU_SELINUX_HIDE_OWNER:-bakasu}"
          SUSFS_PATCH_FILE="50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch"
          case "$SEL_OWNER" in
            bakasu)
              python3 - "$SUSFS_PATCH_FILE" <<'PY'
          import re, sys
          path = sys.argv[1]
          src = open(path, encoding='utf-8', errors='surrogateescape').read()
          parts = re.split(r'(?m)^(?=diff --git )', src)
          drop = {'security/selinux/hooks.c', 'security/selinux/selinuxfs.c', 'security/selinux/ss/services.c'}
          kept, dropped = [], []
          for p in parts:
              m = re.match(r'diff --git a/(\S+) b/', p)
              if m and m.group(1) in drop:
                  dropped.append(m.group(1))
                  continue
              kept.append(p)
          open(path, 'w', encoding='utf-8', errors='surrogateescape').write(''.join(kept))
          print('SUSFS SELinux-hide sections left to BakaSU:', ' '.join(dropped) or 'none found')
          PY
              echo "selinux-hide owner: bakasu (SUSFS hooks.c/selinuxfs.c/services.c sections not applied)" \
                | tee "$GITHUB_WORKSPACE/_ox_debug/selinux-hide-owner.txt"
              ;;
            susfs)
              echo "::warning::OX_BAKASU_SELINUX_HIDE_OWNER=susfs: SUSFS SELinux-hide hooks applied. These lack KernelSU #3877 (timing side-channel fix); BakaSU blocks this combination upstream for that reason."
              echo "selinux-hide owner: susfs (no #3877 fix)" | tee "$GITHUB_WORKSPACE/_ox_debug/selinux-hide-owner.txt"
              ;;
            *)
              echo "::error::OX_BAKASU_SELINUX_HIDE_OWNER must be 'bakasu' or 'susfs' (got '$SEL_OWNER')."
              exit 1
              ;;
          esac

          GATE_MK="$KW/KernelSU/kernel/tools/susfs_compat.mk"
          if [ -f "$GATE_MK" ] && grep -q 'Please wait susfs update' "$GATE_MK"; then
            gate_lines="$(grep -cE 'susfs has NOT update with latest KernelSU source|Please wait simonpunk update|\$\(error Please wait susfs update\.\)' "$GATE_MK" || true)"
            all_errors="$(grep -c '\$(error' "$GATE_MK" || true)"
            if [ "$gate_lines" != "3" ] || [ "$all_errors" != "1" ]; then
              echo "::error::BakaSU susfs_compat.mk gate is not the known 3-line block (matched=$gate_lines, errors=$all_errors). Review it before building."
              cp -f "$GATE_MK" "$GITHUB_WORKSPACE/_ox_debug/susfs_compat.mk.unexpected" || true
              exit 1
            fi
            sed -i -E '/susfs has NOT update with latest KernelSU source/d; /Please wait simonpunk update/d; /\$\(error Please wait susfs update\.\)/d' "$GATE_MK"
            if grep -q '\$(error' "$GATE_MK"; then
              echo "::error::BakaSU SUSFS gate removal did not take effect."; exit 1
            fi
            git -C "$KW/KernelSU" update-index --assume-unchanged kernel/tools/susfs_compat.mk || true
            echo "bakasu susfs gate: lifted (selinux-hide owner=$SEL_OWNER)" | tee "$GITHUB_WORKSPACE/_ox_debug/bakasu-susfs-gate.txt"
          else
            echo "bakasu susfs gate: not present at this ref (nothing to lift)" | tee "$GITHUB_WORKSPACE/_ox_debug/bakasu-susfs-gate.txt"
          fi

          echo "==> Applying CCTV18 SUSFS patch with policy: ${{ inputs.susfs_patch_policy }}"
          set +e
          patch -p1 -N -F 3 < "50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch" 2>&1 | tee "$GITHUB_WORKSPACE/_ox_debug/cctv18-susfs-patch.log"
          patch_rc=${PIPESTATUS[0]}
          set -e

          if [ "$patch_rc" -ne 0 ]; then
            echo "SUSFS patch returned rc=$patch_rc" | tee -a "$GITHUB_WORKSPACE/_ox_debug/cctv18-susfs-patch.log"
            find . -name '*.rej' -print | sort | tee "$GITHUB_WORKSPACE/_ox_debug/susfs-rejects.txt"
            reject_count="$(wc -l < "$GITHUB_WORKSPACE/_ox_debug/susfs-rejects.txt" | tr -d ' ')"
            only_task_mmu="false"
            if [ "$reject_count" = "1" ] && grep -qx './fs/proc/task_mmu.c.rej' "$GITHUB_WORKSPACE/_ox_debug/susfs-rejects.txt"; then
              only_task_mmu="true"
            fi

            if [ "${{ inputs.susfs_patch_policy }}" = "strict" ]; then
              echo "::error::SUSFS patch reject found and strict policy is enabled."
              exit 1
            elif [ "${{ inputs.susfs_patch_policy }}" = "audited_cctv18" ] && [ "$only_task_mmu" != "true" ]; then
              echo "::error::Unexpected SUSFS reject. audited_cctv18 only allows ./fs/proc/task_mmu.c.rej."
              exit 1
            else
              echo "==> Note: continuing with audited CCTV18 SUSFS reject handling (the known, expected task_mmu.c reject). No non-CCTV18 SUSFS source is imported."
              while read -r rej; do
                [ -n "$rej" ] || continue
                safe="$(echo "$rej" | sed 's#^./##; s#[/ ]#_#g')"
                cp -f "$rej" "$GITHUB_WORKSPACE/_ox_debug/${safe}" || true
                rm -f "$rej"
              done < "$GITHUB_WORKSPACE/_ox_debug/susfs-rejects.txt"
            fi
          fi

          # Deliberately not applying 69_hide_stuff.patch in the first ReSukiSU stable lane.
          # ReSukiSU has its own SUSFS symbol hiding options; test boot/root/SUSFS first.



          # ---- v111: verify the SUSFS su-hook guard is the FIXED variant ----
          # History: CCTV18 susfs4oki 83dcd81 (2026-08-15) guarded the su hook in
          # fs/exec.c with susfs_is_current_proc_umounted(). That flag is set for
          # every SUSFS-"umounted" process -- i.e. every zygote-spawned app AND every
          # shell -- so execve of /system/bin/su was skipped and failed with ENOENT
          # ("cannot execute: required file not found") in Termux / adb shell, while
          # apps taking root via binder/supercall were unaffected.
          # Upstream fixed this in 525c450 (2026-08-19) by switching to
          # susfs_is_current_proc_no_su(), which only skips processes explicitly
          # marked as not-allowed-root.
          # susfs_ref is pinned to a commit containing that fix; this check makes a
          # regression impossible to miss if the pin is ever changed.
          if grep -q "susfs_is_current_proc_no_su" fs/exec.c 2>/dev/null; then
            echo "==> su-hook guard OK: fs/exec.c uses susfs_is_current_proc_no_su() (fixed variant)."
            echo "su-hook guard: no_su (FIXED)" > "$GITHUB_WORKSPACE/_ox_debug/su-hook-guard.txt"
          elif grep -q "susfs_is_current_proc_umounted" fs/exec.c 2>/dev/null; then
            # v111: OLD generation is VALID when the driver is also old generation.
            # The pairing check above is authoritative; this is informational only.
            echo "==> su-hook guard: susfs_is_current_proc_umounted() (OLD generation)."
            echo "    Valid only with an OLD-generation driver (e.g. sukisu 6c13a06)."
            echo "    The pairing check above verifies that; it is what can fail the build."
            echo "su-hook guard: umounted (old generation)" > "$GITHUB_WORKSPACE/_ox_debug/su-hook-guard.txt"
          else
            echo "::warning::Could not find either su-hook guard in fs/exec.c; SUSFS layout may have changed."
            echo "su-hook guard: not found" > "$GITHUB_WORKSPACE/_ox_debug/su-hook-guard.txt"
          fi
          if find . -name '*.rej' -print -quit | grep -q .; then
            echo "::error::Unexpected patch rejects remain after CCTV18 SUSFS stage."
            find . -name '*.rej' -print | tee "$GITHUB_WORKSPACE/_ox_debug/rejects-after-susfs-stage.txt"
            exit 1
          fi


      - name: "Apply optional CCTV18 feature patches"
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace/common

          find_patch_by_regex() {
            local regex="$1"
            find "$GITHUB_WORKSPACE/cctv18_assets" -type f | grep -Ei "$regex" | sort | head -n 1 || true
          }

          clean_apply_optional_patch() {
            local label="$1"
            local enabled="$2"
            local regex="$3"
            if [ "$enabled" != "true" ]; then
              echo "Skipping $label: disabled" | tee -a "$GITHUB_WORKSPACE/_ox_debug/optional-patches.log"
              return 0
            fi
            local patch_file
            patch_file="$(find_patch_by_regex "$regex" || true)"
            if [ -z "$patch_file" ]; then
              echo "Optional patch not found for $label; skipping." | tee -a "$GITHUB_WORKSPACE/_ox_debug/optional-patches.log"
              return 0
            fi
            echo "Checking optional patch for $label: $patch_file" | tee -a "$GITHUB_WORKSPACE/_ox_debug/optional-patches.log"
            if patch --dry-run -p1 -N -F 3 < "$patch_file" > "$GITHUB_WORKSPACE/_ox_debug/dryrun-${label//[^A-Za-z0-9]/_}.log" 2>&1; then
              echo "Applying optional patch for $label" | tee -a "$GITHUB_WORKSPACE/_ox_debug/optional-patches.log"
              patch -p1 -N -F 3 < "$patch_file" >> "$GITHUB_WORKSPACE/_ox_debug/apply-${label//[^A-Za-z0-9]/_}.log" 2>&1
            else
              echo "::warning::Optional patch for $label did not apply cleanly; skipped to avoid partial patch contamination."
              cat "$GITHUB_WORKSPACE/_ox_debug/dryrun-${label//[^A-Za-z0-9]/_}.log" || true
            fi
          }

          # ---- v111: ADIOS / Re:Kernel / Baseband Guard, done properly ----
          # Up to v109 these three inputs looked for .patch files that do not exist
          # in cctv18_assets, logged "Optional patch not found" and silently did
          # nothing. ADIOS (block/Kconfig.iosched) and Re:Kernel (drivers/rekernel)
          # are already IN the CCTV18 6.6.118 source and only need =y; Baseband
          # Guard is an LSM added by cctv18/Baseband-guard's setup.sh. Same method
          # as CCTV18's own builder; BBG pinned to a commit. None of the three
          # touch kernel headers (checked), so no GKI KMI impact.
          if [ "${{ inputs.adios == 'On' }}" = "true" ]; then
            if grep -q '^config MQ_IOSCHED_ADIOS' block/Kconfig.iosched 2>/dev/null; then
              echo "OX_EN_ADIOS=1" >> "$GITHUB_ENV"; echo "adios: source present -> will be =y (default scheduler)" | tee -a "$GITHUB_WORKSPACE/_ox_debug/optional-patches.log"
            else
              echo "::warning::ADIOS requested but block/Kconfig.iosched has no MQ_IOSCHED_ADIOS; skipped."
            fi
          fi
          if [ "${{ inputs.rekernel == 'On' }}" = "true" ]; then
            if [ -f drivers/rekernel/Kconfig ] && grep -q '^config REKERNEL' drivers/rekernel/Kconfig; then
              echo "OX_EN_REKERNEL=1" >> "$GITHUB_ENV"; echo "rekernel: source present -> will be =y" | tee -a "$GITHUB_WORKSPACE/_ox_debug/optional-patches.log"
            else
              echo "::warning::Re:Kernel requested but drivers/rekernel is missing; skipped."
            fi
          fi
          if [ "${{ inputs.bbg == 'On' }}" = "true" ]; then
            BBG_SHA="a5b57f15d6b597a1bd157c42330fe80020b1d628"
            rm -rf Baseband-guard
            if git clone -q https://github.com/cctv18/Baseband-guard Baseband-guard && git -C Baseband-guard checkout -q "$BBG_SHA"; then
              # setup.sh: with an existing clone + a ref argument it checks out exactly that ref
              git -C Baseband-guard show "$BBG_SHA:setup.sh" > "$GITHUB_WORKSPACE/_ox_debug/bbg-setup.sh"
              # Its final "set your defconfig" notice uses gawk-only awk and can exit
              # non-zero on mawk; the install itself is verified right below instead.
              sh "$GITHUB_WORKSPACE/_ox_debug/bbg-setup.sh" "$BBG_SHA" >> "$GITHUB_WORKSPACE/_ox_debug/optional-patches.log" 2>&1 \
                || echo "bbg: setup.sh exited non-zero (LSM notice); verifying install..." | tee -a "$GITHUB_WORKSPACE/_ox_debug/optional-patches.log"
              got="$(git -C Baseband-guard rev-parse HEAD)"
              if [ "$got" = "$BBG_SHA" ] && [ -e security/baseband-guard/Kconfig ] && grep -q 'baseband-guard' security/Makefile \
                 && grep -q 'security/baseband-guard/Kconfig' security/Kconfig; then
                echo "OX_EN_BBG=1" >> "$GITHUB_ENV"; echo "bbg: installed at $got -> will be =y" | tee -a "$GITHUB_WORKSPACE/_ox_debug/optional-patches.log"
              else
                echo "::error::Baseband Guard setup did not complete as expected (HEAD=$got)."; exit 1
              fi
            else
              echo "::warning::Could not fetch Baseband-guard; BBG skipped."
            fi
          fi
          clean_apply_optional_patch "unicode" "true" "(^|/).*unicode.*\.patch$"
          clean_apply_optional_patch "fengchi" "${{ inputs.fengchi == 'On' }}" "(^|/).*(fengchi|hmbird|sched).*\.patch$"

          clean_apply_patch_group() {
            local label="$1"
            local enabled="$2"
            local regex="$3"
            if [ "$enabled" != "true" ]; then
              echo "Skipping $label patch group: disabled" | tee -a "$GITHUB_WORKSPACE/_ox_debug/optional-patches.log"
              return 0
            fi
            mapfile -t patches < <(find "$GITHUB_WORKSPACE/cctv18_assets" -type f | grep -Ei "$regex" | sort || true)
            if [ "$label" = "lz4_zstd" ] && [ "${#patches[@]}" -gt 0 ]; then
              mapfile -t patches < <(printf "%s\n" "${patches[@]}" | grep -Evi '(lz4kd|lz4k)' || true)
            fi
            if [ "${#patches[@]}" -eq 0 ]; then
              echo "Optional patch group not found for $label; skipping." | tee -a "$GITHUB_WORKSPACE/_ox_debug/optional-patches.log"
              return 0
            fi
            for patch_file in "${patches[@]}"; do
              echo "Checking optional patch group $label: $patch_file" | tee -a "$GITHUB_WORKSPACE/_ox_debug/optional-patches.log"
              safe="${label}_$(basename "$patch_file" | sed 's/[^A-Za-z0-9]/_/g')"
              if patch --dry-run -p1 -N -F 3 < "$patch_file" > "$GITHUB_WORKSPACE/_ox_debug/dryrun-${safe}.log" 2>&1; then
                echo "Applying optional patch group $label: $patch_file" | tee -a "$GITHUB_WORKSPACE/_ox_debug/optional-patches.log"
                patch -p1 -N -F 3 < "$patch_file" >> "$GITHUB_WORKSPACE/_ox_debug/apply-${safe}.log" 2>&1
              else
                echo "::warning::Optional patch $patch_file for $label did not apply cleanly; skipped to avoid partial patch contamination."
                cat "$GITHUB_WORKSPACE/_ox_debug/dryrun-${safe}.log" || true
              fi
            done
          }

          clean_apply_patch_group "lz4_zstd" "${{ inputs.lz4_zram_patch == 'On' }}" "(^|/).*(zram_patch|lz4|zstd).*[.]patch$"
          clean_apply_patch_group "lz4kd" "false" "(^|/).*(lz4kd|lz4k).*[.]patch$"

          if find . -name '*.rej' -print -quit | grep -q .; then
            echo "::error::Patch rejects found after optional patch stage."
            find . -name '*.rej' -print | tee "$GITHUB_WORKSPACE/_ox_debug/rejects-after-optional-stage.txt"
            exit 1
          fi

      - name: "Enable features via defconfig"
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace/common
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang18/bin:$GITHUB_WORKSPACE/kernel_workspace/build-tools/path/linux-x86:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          MAKE_ARGS=(O=out ARCH=arm64 LLVM=1 LLVM_IAS=1)
          echo "==> Toolchain check"
          which clang | tee "$GITHUB_WORKSPACE/_ox_debug/clang-path.txt"
          clang --version | tee "$GITHUB_WORKSPACE/_ox_debug/clang-version.txt"

          echo "==> Generating gki_defconfig"
          make "${MAKE_ARGS[@]}" gki_defconfig

          cfg="out/.config"
          if [ ! -f "$cfg" ]; then
            echo "::error::Missing generated .config"
            exit 1
          fi

          cfg_sym() { local s="$1"; echo "${s#CONFIG_}"; }
          set_y() { scripts/config --file "$cfg" -e "$(cfg_sym "$1")" || true; }
          set_m() { scripts/config --file "$cfg" -m "$(cfg_sym "$1")" || true; }
          set_n() { scripts/config --file "$cfg" -d "$(cfg_sym "$1")" || true; }
          set_str() { scripts/config --file "$cfg" --set-str "$(cfg_sym "$1")" "$2" || true; }

          echo "==> Applying v111 ReSukiSU daily-driver config profile: ${{ inputs.profile }}"
          set_y CONFIG_KSU

          if [ "${{ inputs.kpm_enable }}" = "true" ]; then
            echo "==> Enabling ReSukiSU KPM support"
            set_y CONFIG_KPM
            set_y CONFIG_KALLSYMS
            set_y CONFIG_KALLSYMS_ALL
          fi

          if [ "${{ inputs.multi_manager_support }}" = "true" ]; then
            set_y CONFIG_KSU_MULTI_MANAGER_SUPPORT
          fi

          echo "==> Requested ReSukiSU hook target: ${{ inputs.hook_mode }}"
          case "${{ inputs.hook_mode }}" in
            inline_susfs)
              # SUSFS-inlined hooks only.
              #
              # KNOWN LIMITATION -- `su` from a shell does NOT work in this mode.
              # CCTV18's SUSFS patch inlines this into fs/exec.c:
              #     if (likely(susfs_is_current_proc_umounted()))
              #             goto orig_flow;               <-- skips sucompat
              #     if (static_branch_likely(&ksu_su_compat_enabled))
              #             ksu_handle_execveat_sucompat(...);
              # Every SUSFS-"umounted" process (all zygote-spawned apps and shell
              # contexts) jumps past the su hook, so execve of /system/bin/su is
              # never redirected -> ENOENT. stat/faccessat are inlined WITHOUT the
              # guard, so `su` still LOOKS present. Apps using the binder/supercall
              # path are unaffected; only `su` via execve breaks.
              set_y CONFIG_KSU_SUSFS
              set_n CONFIG_KSU_TRACEPOINT_HOOK
              set_n CONFIG_KSU_MANUAL_HOOK
              set_n CONFIG_KSU_KPROBES_HOOK
              set_n CONFIG_KSU_WITH_KPROBES
              ;;
            resukisu_auto)
              # Let the selected ReSukiSU ref choose its hook defaults. Useful only for testing.
              true
              ;;
            tracepoint_test)
              set_y CONFIG_KSU_TRACEPOINT_HOOK
              set_n CONFIG_KSU_SUSFS
              set_n CONFIG_KSU_MANUAL_HOOK
              ;;
          esac

          if [ "${{ inputs.SUSFS }}" = "On" ]; then
            # v111: only the 10 SUSFS options that ACTUALLY EXIST in the root driver.
            # Verified against the Kconfig of all three projects (SukiSU-Ultra,
            # ReSukiSU, pershoot/KernelSU-Next) -- each defines exactly these 10.
            # REMOVED because no project defines them, so olddefconfig silently
            # dropped them and they only created false confidence:
            #   CONFIG_KSU_SUSFS_TRY_UMOUNT
            #   CONFIG_KSU_SUSFS_SUS_SU                     (deprecated upstream)
            #   CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
            #   CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
            # Per-app unmounting is handled by the manager's App Profile
            # ("umount modules"), not by a kernel config symbol.
            for opt in \
              CONFIG_KSU_SUSFS \
              CONFIG_KSU_SUSFS_SUS_PATH \
              CONFIG_KSU_SUSFS_SUS_MOUNT \
              CONFIG_KSU_SUSFS_SUS_KSTAT \
              CONFIG_KSU_SUSFS_SUS_MAP \
              CONFIG_KSU_SUSFS_SPOOF_UNAME \
              CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              CONFIG_KSU_SUSFS_OPEN_REDIRECT; do
              set_y "$opt"
            done
            # Battery/performance: SUSFS kernel logging is pure overhead on a daily
            # driver (it logs on SUSFS operations). Upstream defaults it to y; we
            # force it off.
            set_n CONFIG_KSU_SUSFS_ENABLE_LOG
          fi


          # Mountify / Magic Mount friendly tmpfs support.
          # v111: enable the source-present features detected in the optional stage
          if [ "${OX_EN_ADIOS:-0}" = "1" ]; then
            set_y CONFIG_MQ_IOSCHED_ADIOS
            set_y CONFIG_MQ_IOSCHED_DEFAULT_ADIOS
          else
            set_n CONFIG_MQ_IOSCHED_DEFAULT_ADIOS
          fi
          if [ "${OX_EN_REKERNEL:-0}" = "1" ]; then set_y CONFIG_REKERNEL; fi
          if [ "${OX_EN_BBG:-0}" = "1" ]; then
            set_y CONFIG_BBG
            cur_lsm="$(sed -n 's/^CONFIG_LSM="\(.*\)"$/\1/p' "$cfg")"
            [ -n "$cur_lsm" ] || cur_lsm="landlock,lockdown,yama,loadpin,safesetid,selinux,smack,tomoyo,apparmor,bpf"
            case ",$cur_lsm," in *,baseband_guard,*) ;; *) cur_lsm="$cur_lsm,baseband_guard" ;; esac
            scripts/config --file "$cfg" --set-str LSM "$cur_lsm"
          fi
          set_y CONFIG_TMPFS_XATTR
          set_y CONFIG_TMPFS_POSIX_ACL

          # Stock-mimic default: keep uname -r exactly controlled by kernel_suffix.
          set_str CONFIG_LOCALVERSION "-${{ inputs.kernel_suffix }}"
          set_n CONFIG_LOCALVERSION_AUTO

          set_y CONFIG_LTO_CLANG_THIN
          set_n CONFIG_LTO_NONE

          case "${{ inputs.optimise }}" in
            O2)
              set_y CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE
              set_n CONFIG_CC_OPTIMIZE_FOR_SIZE
              set_n CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3
              ;;
            O3)
              set_y CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3
              ;;
          esac

          set_m CONFIG_ZRAM
          set_m CONFIG_ZSMALLOC

          if [ "${{ inputs.zram_module }}" = "On" ]; then
            echo "==> Keeping vendor-compatible modular ZRAM with LZ4/LZ4HC/ZSTD support"
            for opt in \
              CONFIG_CRYPTO_LZ4 \
              CONFIG_CRYPTO_LZ4HC \
              CONFIG_CRYPTO_ZSTD \
              CONFIG_LZ4_COMPRESS \
              CONFIG_LZ4_DECOMPRESS \
              CONFIG_ZSTD_COMPRESS \
              CONFIG_ZSTD_DECOMPRESS; do
              set_y "$opt"
            done
            set_y CONFIG_ZRAM_WRITEBACK
            set_y CONFIG_ZRAM_MULTI_COMP
            set_str CONFIG_ZRAM_DEF_COMP "${{ inputs.zram_comp }}"
          fi

          if [ "${{ inputs.proxy == 'On' }}" = "true" ]; then
            for opt in \
              CONFIG_NETFILTER \
              CONFIG_NETFILTER_ADVANCED \
              CONFIG_NETFILTER_XTABLES \
              CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
              CONFIG_NETFILTER_XT_MATCH_COMMENT \
              CONFIG_NETFILTER_XT_MATCH_CONNTRACK \
              CONFIG_NETFILTER_XT_MATCH_MARK \
              CONFIG_NETFILTER_XT_TARGET_MARK \
              CONFIG_NETFILTER_XT_TARGET_HL \
              CONFIG_NETFILTER_XT_MATCH_HL \
              CONFIG_IP_SET \
              CONFIG_IP_SET_BITMAP_IP \
              CONFIG_IP_SET_BITMAP_IPMAC \
              CONFIG_IP_SET_BITMAP_PORT \
              CONFIG_IP_SET_HASH_IP \
              CONFIG_IP_SET_HASH_IPMARK \
              CONFIG_IP_SET_HASH_IPPORT \
              CONFIG_IP_SET_HASH_IPPORTIP \
              CONFIG_IP_SET_HASH_IPPORTNET \
              CONFIG_IP_SET_HASH_IPMAC \
              CONFIG_IP_SET_HASH_MAC \
              CONFIG_IP_SET_HASH_NET \
              CONFIG_IP_SET_HASH_NETNET \
              CONFIG_IP_SET_HASH_NETPORT \
              CONFIG_IP_SET_HASH_NETPORTNET \
              CONFIG_IP_SET_HASH_NETIFACE \
              CONFIG_IP_SET_LIST_SET \
              CONFIG_NETFILTER_XT_SET \
              CONFIG_IP6_NF_IPTABLES \
              CONFIG_IP6_NF_NAT \
              CONFIG_IP6_NF_TARGET_MASQUERADE; do
              set_y "$opt"
            done
            # v111: symbol-name corrections verified against the real 6.6.118
            # net/netfilter Kconfig. The following DID NOT EXIST and were silently
            # dropped by olddefconfig, so these features were never actually built:
            #   CONFIG_NETFILTER_XT_TARGET_HL -> real symbol is ..._TARGET_HL
            #   CONFIG_NETFILTER_XT_MATCH_TTL  -> real symbol is ..._MATCH_HL
            #     (upstream merged them: "adds the HL (for IPv6) and TTL (for IPv4)")
            #   CONFIG_NETFILTER_XT_MATCH_SET  -> real symbol is CONFIG_NETFILTER_XT_SET
            #     (without it CONFIG_IP_SET is unusable from iptables)
            # The extra IP_SET_* variants match CCTV18's own builder and make ipset
            # actually usable for firewall / ad-block modules.
            scripts/config --file "$cfg" --set-val CONFIG_IP_SET_MAX 65534 || true
            # v111: CCTV18 warns that CONFIG_IP6_NF_NAT=y triggers a "device has an
            # internal problem" boot banner on some units. Their fix is config.patch,
            # which hides the symbol from config_data.gz without disabling the feature.
            # Apply it best-effort so proxy users don't get the scary boot warning.
            CFG_PATCH="$GITHUB_WORKSPACE/cctv18_assets/other_patch/config.patch"
            if [ -f "$CFG_PATCH" ]; then
              if patch --dry-run -p1 -N -F 3 < "$CFG_PATCH" >/dev/null 2>&1; then
                patch -p1 -N -F 3 < "$CFG_PATCH" >/dev/null 2>&1 \
                  && echo "==> config.patch applied (IP6_NF_NAT boot-warning fix)." \
                  || echo "::warning::config.patch apply failed after clean dry-run; continuing."
              else
                echo "::warning::config.patch did not dry-run cleanly; skipping IP6_NF_NAT display fix."
              fi
            fi
          fi

          set_n CONFIG_DEFAULT_BBR || true
          case "${{ inputs.bbr }}" in
            off|Off)
              set_n CONFIG_TCP_CONG_BBR
              ;;
            enabled|On)
              set_y CONFIG_TCP_CONG_BBR
              ;;
            default|Default)
              set_y CONFIG_TCP_CONG_BBR
              set_y CONFIG_DEFAULT_BBR || true
              ;;
          esac

          if [ "true" = "true" ]; then
            set_y CONFIG_NTSYNC
          fi


          if [ "false" = "true" ]; then
            for opt in CONFIG_TMPFS_XATTR CONFIG_TMPFS_POSIX_ACL CONFIG_PID_NS CONFIG_USER_NS CONFIG_UTS_NS CONFIG_IPC_NS; do
              set_y "$opt"
            done
          fi

          case "${{ inputs.profile }}" in
            minimal_safe)
              set_n CONFIG_TCP_CONG_BBR
              set_n CONFIG_IP_SET
              set_n CONFIG_NTSYNC
              set_n CONFIG_KPM
              ;;
            debug_only)
              set_y CONFIG_KSU_SUSFS_ENABLE_LOG
              ;;
            stock_plus)
              set_y CONFIG_NTSYNC
              ;;
          esac

          echo "==> Running olddefconfig directly; no yes pipe, no SIGPIPE false failure"
          make "${MAKE_ARGS[@]}" olddefconfig

          cp -f out/.config "$GITHUB_WORKSPACE/_ox_debug/final.config"

          for opt in CONFIG_ZRAM CONFIG_ZSMALLOC; do
            if ! grep -qx "${opt}=m" out/.config; then
              echo "::error::${opt}=m is required for ColorOS vendor HybridSwap compatibility."
              exit 1
            fi
          done

          echo "==> Final ReSukiSU/SUSFS inline hook audit" | tee "$GITHUB_WORKSPACE/_ox_debug/hook-mode-audit.txt"
          {
            echo "Requested hook mode: ${{ inputs.hook_mode }}"
            echo "Detected ReSukiSU symbols:"
            grep -E 'CONFIG_KSU(_TRACEPOINT_HOOK|_MANUAL_HOOK|_SUSFS|_MULTI_MANAGER_SUPPORT|_TOOLKIT_SUPPORT|_DISABLE_MANAGER|_DISABLE_POLICY)?=' out/.config || true
            grep -E 'CONFIG_KPM=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=' out/.config || true
            echo "Detected generic KPROBES state:"
            grep -E 'CONFIG_KPROBES=' out/.config || true
          } | tee -a "$GITHUB_WORKSPACE/_ox_debug/hook-mode-audit.txt"

          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "::error::CONFIG_KSU=y missing after olddefconfig."
            exit 1
          fi

          if [ "${{ inputs.SUSFS }}" = "On" ]; then
            if ! grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "::error::CONFIG_KSU_SUSFS=y missing after olddefconfig. ReSukiSU inline SUSFS was requested but not accepted."
              exit 1
            fi
          fi

          if [ "${{ inputs.hook_mode }}" = "inline_susfs" ]; then
            if ! grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "::error::inline_susfs requested, but ReSukiSU did not keep CONFIG_KSU_SUSFS=y."
              exit 1
            fi
            if grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y' out/.config || grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config || grep -q '^CONFIG_KSU_KPROBES_HOOK=y' out/.config || grep -q '^CONFIG_KSU_WITH_KPROBES=y' out/.config; then
              echo "::error::inline_susfs requested, but another ReSukiSU hook selector is still enabled."
              exit 1
            fi
          fi

          if [ "${{ inputs.kpm_enable }}" = "true" ] && ! grep -q '^CONFIG_KPM=y' out/.config; then
            echo "==> Note: KPM was requested but ReSukiSU has no kernel-side KPM (CONFIG_KPM absent by design). Continuing without KPM; this is expected on ReSukiSU."
          fi

          echo "==> Final config scan"
          grep -E 'CONFIG_KSU|CONFIG_KPM|CONFIG_KALLSYMS|CONFIG_LOCALVERSION|CONFIG_TCP_CONG_BBR|CONFIG_DEFAULT_BBR|CONFIG_IP_SET|CONFIG_NTSYNC|CONFIG_LTO|CONFIG_CC_OPTIMIZE|CONFIG_NETFILTER_XT_TARGET_HL|CONFIG_ADIOS|CONFIG_BBG|CONFIG_BASEBAND|CONFIG_ZRAM|CONFIG_ZSMALLOC|CONFIG_CRYPTO_LZ4|CONFIG_LZ4|CONFIG_ZSTD' out/.config | tee "$GITHUB_WORKSPACE/_ox_debug/config-scan.txt" || true

          # ---- v111 SUSFS config audit ----
          # Verifies that every SUSFS option we asked for actually landed as =y in
          # the FINAL .config. Previously four options were requested that no root
          # project defines, so olddefconfig silently dropped them and the build
          # looked correct while the features were absent. This turns that class of
          # silent failure into a visible warning.
          {
            echo "SUSFS config audit (expected =y unless noted)"
            for s in CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT \
                     CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_SUS_MAP \
                     CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                     CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS CONFIG_KSU_SUSFS_OPEN_REDIRECT; do
              if grep -q "^${s}=y" out/.config; then
                echo "  OK       ${s}=y"
              else
                echo "  MISSING  ${s} (requested but not enabled)"
                echo "::warning::SUSFS option ${s} was requested but is NOT enabled in the final .config."
              fi
            done
            if grep -q "^CONFIG_KSU_SUSFS_ENABLE_LOG=y" out/.config; then
              echo "  NOTE     CONFIG_KSU_SUSFS_ENABLE_LOG=y (expected off for battery)"
              echo "::warning::SUSFS kernel logging is ON; this costs battery on a daily driver."
            else
              echo "  OK       CONFIG_KSU_SUSFS_ENABLE_LOG disabled (battery-friendly)"
            fi
          } | tee "$GITHUB_WORKSPACE/_ox_debug/susfs-config-audit.txt" || true

      - name: "Build kernel"
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace/common
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang18/bin:$GITHUB_WORKSPACE/kernel_workspace/build-tools/path/linux-x86:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CCACHE_DIR="$CCACHE_DIR"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE/kernel_workspace"
          export CCACHE_NOHASHDIR=true
          export CCACHE_COMPILERCHECK=none
          export KBUILD_BUILD_USER="${{ inputs.BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ inputs.BUILD_HOST }}"
          if [ "${{ inputs.BUILD_TIME }}" = "F" ]; then
            export KBUILD_BUILD_TIMESTAMP="$(date -u '+%a %b %d %H:%M:%S UTC %Y')"
          else
            export KBUILD_BUILD_TIMESTAMP="${{ inputs.BUILD_TIME }}"
          fi

          MAKE_ARGS=(O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang")
          echo "==> Building Image"
          make -j"$(nproc --all)" "${MAKE_ARGS[@]}" Image 2>&1 | tee "$GITHUB_WORKSPACE/_ox_debug/build.log"

          # v111: confirm who ended up implementing SELinux hiding.
          if grep -q "selinux_hide manual hook found" "$GITHUB_WORKSPACE/_ox_debug/build.log"; then
            sel_impl="susfs-hooks"
          else
            sel_impl="bakasu-own"
          fi
          echo "selinux_hide implementation in this Image: $sel_impl" | tee -a "$GITHUB_WORKSPACE/_ox_debug/selinux-hide-owner.txt"
          if [ "${OX_BAKASU_SELINUX_HIDE_OWNER:-bakasu}" = "bakasu" ] && [ "$sel_impl" != "bakasu-own" ]; then
            echo "::error::Expected BakaSU's own selinux_hide, but the build used SUSFS's manual hook. The SUSFS SELinux-hide filter did not take effect."
            exit 1
          fi

          image="out/arch/arm64/boot/Image"
          if [ ! -s "$image" ]; then
            echo "::error::Kernel Image was not produced."
            find out -maxdepth 6 -type f -name 'Image*' -printf '%p %s bytes\n' | tee "$GITHUB_WORKSPACE/_ox_debug/image-search.txt" || true
            exit 1
          fi

          cp -f "$image" "$GITHUB_WORKSPACE/artifacts/Image_OP13_ReSukiSU_CCTV18_inline_stocklike_v111"
          sha256sum "$GITHUB_WORKSPACE/artifacts/Image_OP13_ReSukiSU_CCTV18_inline_stocklike_v111" | tee "$GITHUB_WORKSPACE/artifacts/Image_OP13_ReSukiSU_CCTV18_inline_stocklike_v111.sha256"

          uts="unknown"
          if [ -f out/include/generated/utsrelease.h ]; then
            cp -f out/include/generated/utsrelease.h "$GITHUB_WORKSPACE/_ox_debug/utsrelease.h"
            uts="$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' out/include/generated/utsrelease.h | head -n1)"
          fi
          echo "UTS_RELEASE=$uts" | tee "$GITHUB_WORKSPACE/_ox_debug/uts.txt"
          echo "uts=$uts" >> "$GITHUB_OUTPUT"
          ccache -s | tee "$GITHUB_WORKSPACE/_ox_debug/ccache-final.txt" || true

      - name: "Package AnyKernel3 (single zip, banner, no breakage)"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ak3_work
          # v111: pin AnyKernel3. An unpinned master already broke flashing once
          # (the uppercase-variable rename); pin it so a fresh build is reproducible.
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_work
          git -C ak3_work fetch -q --depth=1 origin "${AK3_REF}" && git -C ak3_work checkout -q FETCH_HEAD || \
            echo "::warning::Could not pin AnyKernel3 to ${AK3_REF}; using master HEAD."
          git -C ak3_work rev-parse HEAD | tee "$GITHUB_WORKSPACE/_ox_debug/anykernel3_commit.txt"
          # --- AK3 naming-convention guard (v111) ---
          # AK3 renamed its anykernel.sh settings to UPPERCASE. We write both
          # spellings, but if upstream ever changes convention AGAIN this guard
          # makes it obvious in the log instead of silently shipping a zip that
          # aborts at flash time with "Flash failed".
          if grep -q '\$BLOCK' ak3_work/tools/ak3-core.sh; then
            echo "AK3 convention: UPPERCASE (\$BLOCK) - our uppercase vars will be used."
          elif grep -q '\$block' ak3_work/tools/ak3-core.sh; then
            echo "AK3 convention: lowercase (\$block) - our legacy aliases will be used."
          else
            echo "::warning::Could not detect AK3 boot-partition variable convention in ak3-core.sh. Flashing may fail; inspect _ox_debug/anykernel3_commit.txt."
          fi
          rm -rf ak3_work/.git ak3_work/.github ak3_work/README.md || true
          cp -f artifacts/Image_OP13_ReSukiSU_CCTV18_inline_stocklike_v111 ak3_work/Image

          cat > ak3_work/anykernel.sh <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          ## OX1D3X3 OP13 ${{ env.OX_ROOT_DISPLAY_NAME }}+SUSFS

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=${{ inputs.kernel_name }}
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          do.check_boot_version=0
          device.name1=
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties


          ### AnyKernel install
          ## boot shell variables
          # OP13 / PJZ110 is A/B slot device. Use partition-name detection, not old omap path.
          # v111 FLASH FIX: AnyKernel3 upstream renamed these settings to UPPERCASE
          # (BLOCK, IS_SLOT_DEVICE, ...). This workflow clones AK3 master unpinned,
          # so a fresh build picks up the new ak3-core.sh, which IGNORES the old
          # lowercase names. With $BLOCK unset, AK3 cannot resolve the boot
          # partition and aborts immediately after "Installing..." -> "Flash failed".
          # We therefore set BOTH spellings: uppercase for current AK3, lowercase
          # for older/pinned AK3 revisions. Harmless either way.
          BLOCK=boot
          IS_SLOT_DEVICE=auto
          SLOT_SELECT=active
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto
          NO_MAGISK_CHECK=1
          # legacy lowercase aliases (older AnyKernel3)
          block=boot
          is_slot_device=auto
          slot_select=active
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          no_magisk_check=1

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh


          # --- OX1D3X3 CUSTOM START ---
          ui_print ' '
          ui_print '===================================================='
          ui_print '                   __   __  __ '
          ui_print '                  \ \ / //_ |'
          ui_print '                   \ V /   | |'
          ui_print '                     > <    | |'
          ui_print '                   / . \   | |'
          ui_print '                 /_/ \_\  |_|'
          ui_print '===================================================='
          ui_print ' '
          ui_print 'PJZ110 | ${{ env.OX_ROOT_DISPLAY_NAME }} [Daily-Driver optimised]'
          ui_print 'Kernel : 6.6.118-${{ inputs.kernel_suffix }}'
          ui_print 'Hook   : ${{ inputs.hook_mode }} (target: inline SUSFS)'
          ui_print 'Audit  : CONFIG_KSU + CONFIG_KSU_SUSFS + inline hook audit'
          ui_print 'Build  : #${{ github.run_number }} (${{ inputs.kernel_suffix }})'
          ui_print 'Builder: @Ox1d3x3'
          ui_print 'Credits: ${{ env.OX_ROOT_CREDIT }}, @cctv18, osm0sis'
          ui_print 'SUSFS Source : CCTV18 susfs4oki'
          ui_print "ZRAM   : kernel config=${{ inputs.zram_module == 'On' }} / preferred=${{ inputs.zram_comp }}"
          ui_print ' '

          device="$(getprop ro.product.device 2>/dev/null || true)"
          model="$(getprop ro.product.model 2>/dev/null || true)"
          android="$(getprop ro.build.version.release 2>/dev/null || true)"
          patch="$(getprop ro.build.version.security_patch 2>/dev/null || true)"
          slot="$(getprop ro.boot.slot_suffix 2>/dev/null || true)"
          [ -z "$slot" ] && slot="$(getprop ro.boot.slot 2>/dev/null || true)"
          if [ -n "$device" ]; then ui_print "Device : $device ($model)"; fi
          if [ -n "$android" ]; then ui_print "Android: $android"; fi
          if [ -n "$patch" ]; then ui_print "Patch  : $patch"; fi
          if [ -n "$slot" ]; then ui_print "Slot   : $slot"; fi
          ui_print 'Target : active boot partition'
          ui_print ' '

          # Best-effort open project page (may be ignored in recovery)
          if command -v cmd >/dev/null 2>&1; then
          (cmd activity start --user 0 -a android.intent.action.VIEW -d 'https://github.com/ox1d3x3/Op13_Susfs_kernel' >/dev/null 2>&1 &) || true
          elif command -v am >/dev/null 2>&1; then
          (am start --user 0 -a android.intent.action.VIEW -d 'https://github.com/ox1d3x3/Op13_Susfs_kernel' >/dev/null 2>&1 &) || true
          fi
          # --- OX1D3X3 CUSTOM END ---

          # GKI check
          kernel_version=$(cat /proc/version | awk -F '-' '{print $1}' | awk '{print $3}')
          case $kernel_version in
              5.1*) ksu_supported=true ;;
              6.1*) ksu_supported=true ;;
              6.6*) ksu_supported=true ;;
              *) ksu_supported=false ;;
          esac

          ui_print ' '
          ui_print '  -> Thank you for using this kernel, Please dont forget to Star the Project'
          $ksu_supported || abort '  -> Non-GKI device, abort.'

          # boot install
          split_boot

          if [ -f "$SPLITIMG/ramdisk.cpio" ]; then
              unpack_ramdisk
              write_boot
          else
              flash_boot
          fi

          ui_print ' '
          RFM=/data/adb/modules/op13_ram_expansion_fix
          if [ -d "$RFM" ]; then
            if touch "$RFM/disable"; then
              ui_print ' Legacy RAM Expansion property override disabled.'
            else
              ui_print ' Disable op13_ram_expansion_fix in your root manager.'
            fi
          fi
          ui_print ' Reboot Your System '
          ui_print ' '
          ui_print ' '
          AK3
          sed -i 's/^          //' ak3_work/anykernel.sh
          chmod 0755 ak3_work/anykernel.sh

          cat > ak3_work/OX_CCTV18_CLEAN_BUILD_INFO.txt <<EOF
          OX1D3X3 OP13 BakaSU + CCTV18 INLINE SUSFS v111
          Device: OnePlus 13 / sun / PJZ110
          Kernel source: cctv18/android_kernel_common_oneplus_sm8750 @ ${{ env.CCTV18_KERNEL_REF }}
          Build assets: cctv18/oppo_oplus_realme_sm8750
          Root: ReSukiSU via official setup.sh, requested=${{ inputs.resukisu_ref }}, selected=${RESUKISU_SELECTED_REF:-unknown}
          SUSFS: cctv18/susfs4oki only, ref=${{ inputs.susfs_ref }}
          SUSFS patch policy: ${{ inputs.susfs_patch_policy }}
          WildKernels SUSFS patch tree: NOT USED
          TheWildJames kernel_patches: NOT USED
          KernelSU-Next/SukiSU Ultra root glue: NOT USED in this ReSukiSU-first workflow
          Profile: ${{ inputs.profile }}
          Optimise: ${{ inputs.optimise }}
          ZRAM/LZ4 config: ${{ inputs.zram_module == 'On' }} / compressor=${{ inputs.zram_comp }}
          ZRAM runtime tuner: X1 Kernel Manager module (separate tuner zip removed)
          UTS_RELEASE: ${{ steps.build.outputs.uts }}
          Built UTC: $(date -u '+%Y-%m-%d %H:%M:%S')
          EOF
          sed -i 's/^          //' ak3_work/OX_CCTV18_CLEAN_BUILD_INFO.txt

          zip_name="AK3_OP13_ReSukiSU_CCTV18_inline_stocklike_v111_${{ github.run_number }}_FLASH_THIS.zip"
          ( cd ak3_work && zip -r9 "../artifacts/$zip_name" . >/dev/null )
          sha256sum "artifacts/$zip_name" | tee "artifacts/$zip_name.sha256"

          echo "==> AnyKernel3 package scan"
          unzip -p "artifacts/$zip_name" anykernel.sh | sed -n '1,130p' | tee _ox_debug/packaged-anykernel.sh.txt
          if unzip -p "artifacts/$zip_name" anykernel.sh | grep -q 'omap_hsmmc'; then
            echo "::error::Packaged anykernel.sh still contains old omap boot path."
            exit 1
          fi
          if unzip -p "artifacts/$zip_name" anykernel.sh | grep -q 'ExampleKernel'; then
            echo "::error::Packaged anykernel.sh still contains default ExampleKernel banner."
            exit 1
          fi
          if ! unzip -p "artifacts/$zip_name" anykernel.sh | grep -q 'OX1D3X3 CUSTOM START'; then
            echo "::error::OX1D3X3 custom install banner was not packaged."
            exit 1
          fi
          if ! unzip -p "artifacts/$zip_name" anykernel.sh | grep -Fq '${{ env.OX_ROOT_DISPLAY_NAME }} [Daily-Driver optimised]'; then
            echo "::error::OX install info banner was not packaged."
            exit 1
          fi
      - name: "Write build summary and collect debug"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ox_debug artifacts
          {
            echo "Workflow: OP13 ReSukiSU"
            echo "Profile: ${{ inputs.profile }}"
            echo "ReSukiSU requested ref: ${{ inputs.resukisu_ref }}"
            echo "ReSukiSU selected ref: ${RESUKISU_SELECTED_REF:-unknown}"
            echo "SUSFS enabled: ${{ inputs.SUSFS }}"
            echo "SUSFS ref: ${{ inputs.susfs_ref }}"
            echo "SUSFS patch policy: ${{ inputs.susfs_patch_policy }}"
            echo "Hook mode: ${{ inputs.hook_mode }}"
            echo "KPM enabled: ${{ inputs.kpm_enable }}"
            echo "Multi-manager support: ${{ inputs.multi_manager_support }}"
            echo "Manager spoof patch: true (fixed default)"
            echo "LZ4/ZSTD patch group: ${{ inputs.lz4_zram_patch == 'On' }}"
            echo "LZ4KD patch group: false (fixed default for stability)"
            echo "Kernel ref: ${CCTV18_KERNEL_REF}"
            echo "Stock mimic: true"
            echo "Kernel suffix: ${{ inputs.kernel_suffix }}"
            echo "BBR mode: ${{ inputs.bbr }}"
            echo "Better net/proxy: ${{ inputs.proxy }}"
            echo "ZRAM/LZ4: ${{ inputs.zram_module }} / ${{ inputs.zram_comp }}"
            echo "No WildKernels SUSFS patch tree is cloned or used."
            echo "No TheWildJames kernel_patches tree is cloned or used."
            echo "No KernelSU-Next/SukiSU Ultra root glue is cloned or used."
            echo "UTS: ${{ steps.build.outputs.uts }}"
          } | tee _ox_debug/build-summary.txt

          if [ -d kernel_workspace/susfs4ksu ]; then
            git -C kernel_workspace/susfs4ksu remote -v | tee _ox_debug/susfs-remote-final.txt || true
          fi
          if [ -d cctv18_assets ]; then
            git -C cctv18_assets remote -v | tee _ox_debug/cctv18-assets-remote.txt || true
          fi
          if [ -d kernel_workspace/common ]; then
            find kernel_workspace/common -name '*.rej' -o -name '*.orig' 2>/dev/null | sort | tee _ox_debug/rejects-orig-files.txt || true
          fi
          find artifacts _ox_debug -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null | sort | tee _ox_debug/artifact-preview.txt || true

          if [ -f "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "# OP13 BakaSU (ReSukiSU) + CCTV18 Inline StockLike Daily v111"
              echo ""
              echo "## Verdict"
              echo "- Main flashable zip uses fixed AnyKernel3 OP13 boot detection."
              echo "- SUSFS source: CCTV18 only."
              echo "- ZRAM/LZ4 config enabled: ${{ inputs.zram_module == 'On' }} / ${{ inputs.zram_comp }}."
              echo "- ZRAM runtime tuning: use the X1 Kernel Manager module (separate tuner zip removed)."
              echo ""
              echo "## Outputs"
              find artifacts -maxdepth 1 -type f -printf '- `%f`\n' 2>/dev/null | sort
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Upload build outputs (Actions artifact)"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: OP13-RESUKISU-CCTV18-INLINE-STOCKLIKE-v111-${{ github.run_number }}
          path: |
            artifacts/**
            _ox_debug/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14

      - name: "Summary"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s artifacts/Image_OP13_ReSukiSU_CCTV18_inline_stocklike_v111 ]; then
            echo "::error::Build failed before producing Image. Download OP13-RESUKISU-CCTV18-INLINE-STOCKLIKE-v111 debug artifact."
            exit 1
          fi
          if [ "true" = "true" ] && ! ls artifacts/AK3_OP13_ReSukiSU_CCTV18_inline_stocklike_v111_*_FLASH_THIS.zip >/dev/null 2>&1; then
            echo "::error::Image built but AnyKernel3 flashable ZIP was not produced."
            exit 1
          fi
          echo "✅ OP13 ReSukiSU + CCTV18-only SUSFS inline stock-like daily-driver build completed."
          echo "✅ Fixed AnyKernel3 boot partition detection: BLOCK=boot, IS_SLOT_DEVICE=auto, SLOT_SELECT=active."
          echo "✅ No WildKernels/TheWildJames SUSFS patch tree was used."
