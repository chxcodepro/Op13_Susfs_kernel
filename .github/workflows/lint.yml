name: Lint Workflows

# Validates GitHub Actions workflow syntax, ${{ }} expressions, job needs and
# triggers. shellcheck/pyflakes are intentionally disabled so large legacy
# run-blocks don't fail CI on style warnings.

on:
  push:
    paths:
      - ".github/workflows/**"
      - "action.yml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "action.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: actionlint (core checks only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actionlint_api="https://api.github.com/repos/rhysd/actionlint"
          curl_args=(-fL --retry 5 --retry-delay 5 --retry-max-time 300 --connect-timeout 15
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          curl "${curl_args[@]}" -H "Accept: application/vnd.github+json" \
            "$actionlint_api/releases/latest" -o actionlint-release.json
          asset_id="$(jq -er '[.assets[] | select(.name | endswith("_linux_amd64.tar.gz")) | .id] | select(length == 1) | .[0] | numbers | select(. > 0)' actionlint-release.json)"
          curl "${curl_args[@]}" -H "Accept: application/octet-stream" \
            "$actionlint_api/releases/assets/$asset_id" -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color -shellcheck= -pyflakes=

      - name: yamllint (relaxed)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet yamllint
          yamllint -c .github/.yamllint.yml .github/workflows/ action.yml
